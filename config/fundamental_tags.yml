    - {tag: RevenueFromContractWithCustomerExcludingAssessedTax, namespace: us-gaap, title: "Revenue (excl. tax)"}
    - {tag: RevenueFromContractWithCustomerIncludingAssessedTax, namespace: us-gaap, title: "Revenue (incl. tax)"}
    - {tag: CostOfRevenue, namespace: us-gaap, title: "Cost of Revenue"}
    - {tag: CostOfGoodsAndServicesSold, namespace: us-gaap, title: "Cost of Goods & Services Sold"}
    - {tag: CostOfGoodsSold, namespace: us-gaap, title: "Cost of Goods Sold"}
    - {tag: GrossProfit, namespace: us-gaap, title: "Gross Profit"}
    - {tag: ResearchAndDevelopmentExpense, namespace: us-gaap, title: "R&D Expense"}
    - {tag: SellingGeneralAndAdministrativeExpense, namespace: us-gaap, title: "SG&A Expense"}
    - {tag: SellingAndMarketingExpense, namespace: us-gaap, title: "Selling & Marketing"}
    - {tag: GeneralAndAdministrativeExpense, namespace: us-gaap, title: "General & Administrative"}
    - {tag: OperatingExpenses, namespace: us-gaap, title: "Operating Expenses"}
    - {tag: CostsAndExpenses, namespace: us-gaap, title: "Total Costs & Expenses"}
    - {tag: OperatingIncomeLoss, namespace: us-gaap, title: "Operating Income"}
    - {tag: NonoperatingIncomeExpense, namespace: us-gaap, title: "Nonoperating Income"}
    - {tag: OtherNonoperatingIncomeExpense, namespace: us-gaap, title: "Other Nonoperating Income"}
    - {tag: InterestExpense, namespace: us-gaap, title: "Interest Expense"}
    - {tag: InterestExpenseNonoperating, namespace: us-gaap, title: "Interest Expense (Nonoperating)"}
    - {tag: InterestExpenseDebt, namespace: us-gaap, title: "Interest Expense on Debt"}
    - {tag: InterestIncomeExpenseNet, namespace: us-gaap, title: "Interest Income/Expense Net"}
    - {tag: InvestmentIncomeInterest, namespace: us-gaap, title: "Investment Income Interest"}
    - {tag: IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItemsNoncontrollingInterest, namespace: us-gaap, title: "Pre-tax Income"}
    - {tag: IncomeTaxExpenseBenefit, namespace: us-gaap, title: "Income Tax Expense"}
    - {tag: NetIncomeLoss, namespace: us-gaap, title: "Net Income"}
    - {tag: ProfitLoss, namespace: us-gaap, title: "Net Income (Profit/Loss)"}
    - {tag: NetIncomeLossAvailableToCommonStockholdersBasic, namespace: us-gaap, title: "Net Income to Common (Basic)"}
    - {tag: NetIncomeLossAvailableToCommonStockholdersDiluted, namespace: us-gaap, title: "Net Income to Common (Diluted)"}
    - {tag: EarningsPerShareBasic, namespace: us-gaap, title: "EPS Basic"}
    - {tag: EarningsPerShareDiluted, namespace: us-gaap, title: "EPS Diluted"}
