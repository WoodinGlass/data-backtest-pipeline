    - {tag: FiniteLivedIntangibleAssetsNet, namespace: us-gaap, title: "Finite-Lived Intangibles"}
    - {tag: DeferredIncomeTaxAssetsNet, namespace: us-gaap, title: "Deferred Tax Assets"}
