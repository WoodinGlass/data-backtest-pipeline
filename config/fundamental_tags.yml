# XBRL tag registry for SEC EDGAR fundamental ingestion.
#
# Curated set of ~150 tags from the us-gaap and dei namespaces.
# These are the tags downstream models consume; the raw layer stores
# every tag returned by the API (full fidelity), but staging filters
# to this set. See ADR 0010.
#
# Format: category -> list of {tag, namespace, title}.
# namespace is 'us-gaap' or 'dei' (or 'ifrs-full' for foreign filers).
#
# Adding a tag: append to the appropriate category. Removing one:
# delete the line. No code changes required.

metadata:
  version: 1
  history_start: "2015-01-01"
  source: "sec-edgar"
  # Tags that some companies do not report at all. Presence is
  # best-effort; downstream features must tolerate NULLs.
  optional_tags:
    - InventoryNet
    - InventoryFinishedGoods
    - InventoryWorkInProcess
    - InventoryRawMaterials
    - ResearchAndDevelopmentExpense

tags:

  # ── Income statement (40) ────────────────────────────────
  income_statement:
