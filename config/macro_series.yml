# Macro series registry for data-backtest-pipeline.
#
# Curated set of FRED series ingested via ALFRED (vintage-aware).
# See ADR 0009 for the design rationale.
#
# Format: category -> list of {id: <FRED series id>, title: <short label>}.
# The full FRED title and metadata are fetched at ingestion time from
# the `/fred/series` endpoint; we do not duplicate them here.
#
# Adding a series: append to the appropriate category. Removing one:
# delete the line. No code changes required.

metadata:
  version: 1
  history_start: "2015-01-01"
  source: "fred"
  # Series that are known to have sparse vintage history. The ingestion
  # client will still request all vintages; downstream PIT joins must
  # tolerate gaps.
  sparse_vintage_ok:
    - SOFR
    - OBFR
    - EFFR
    - IORB

series:

  # ── Monetary policy (20) ─────────────────────────────────
  monetary_policy:
    - {id: FEDFUNDS,       title: "Fed Funds Effective Rate (Monthly)"}
    - {id: DFF,            title: "Fed Funds Effective Rate (Daily)"}
    - {id: DFEDTARU,       title: "Fed Funds Target Range — Upper"}
    - {id: DFEDTARL,       title: "Fed Funds Target Range — Lower"}
    - {id: EFFR,           title: "Effective Fed Funds Rate"}
    - {id: OBFR,           title: "Overnight Bank Funding Rate"}
    - {id: SOFR,           title: "Secured Overnight Financing Rate"}
    - {id: IORB,           title: "Interest on Reserve Balances"}
    - {id: IOER,           title: "Interest on Excess Reserves (legacy)"}
    - {id: WALCL,          title: "Fed Total Assets"}
    - {id: WLCFLL,         title: "Fed Loans and Leases"}
    - {id: WSHOSHO,        title: "Securities Held Outright"}
    - {id: TREAST,         title: "Treasury Deposits with Fed"}
    - {id: WCURCIR,        title: "Currency in Circulation"}
    - {id: RRPONTSYD,      title: "Overnight Reverse Repos"}
    - {id: BOGMBASE,       title: "Monetary Base"}
    - {id: RESPPLLOPNWW,   title: "Reserve Bank Credit"}
    - {id: WDTGAL,         title: "Deposits with Fed: Treasury General Account"}
    - {id: GFDEBTN,        title: "Federal Debt: Total Public Debt"}

  # ── Rates / Yield curve (22) ─────────────────────────────
  rates:
    - {id: DGS1MO,         title: "1-Month Treasury"}
    - {id: DGS3MO,         title: "3-Month Treasury"}
    - {id: DGS6MO,         title: "6-Month Treasury"}
    - {id: DGS1,           title: "1-Year Treasury"}
    - {id: DGS2,           title: "2-Year Treasury"}
    - {id: DGS3,           title: "3-Year Treasury"}
    - {id: DGS5,           title: "5-Year Treasury"}
    - {id: DGS7,           title: "7-Year Treasury"}
    - {id: DGS10,          title: "10-Year Treasury"}
    - {id: DGS20,          title: "20-Year Treasury"}
    - {id: DGS30,          title: "30-Year Treasury"}
    - {id: T10Y2Y,         title: "10Y-2Y Spread"}
    - {id: T10Y3M,         title: "10Y-3M Spread"}
    - {id: T10YFF,         title: "10Y-Fed Funds Spread"}
    - {id: T5YIFR,         title: "5Y Forward Inflation Rate"}
    - {id: T10YIE,         title: "10Y Breakeven Inflation"}
    - {id: T5YIE,          title: "5Y Breakeven Inflation"}
    - {id: DPRIME,         title: "Bank Prime Loan Rate"}
    - {id: MORTGAGE30US,   title: "30-Year Fixed Mortgage"}
    - {id: MORTGAGE15US,   title: "15-Year Fixed Mortgage"}
    - {id: BAMLH0A0HYM2,   title: "US High Yield OAS"}
    - {id: BAMLC0A0CM,     title: "US Corporate OAS"}

  # ── Inflation (20) ───────────────────────────────────────
  inflation:
    - {id: CPIAUCSL,       title: "CPI All Urban (SA)"}
    - {id: CPIAUCNS,       title: "CPI All Urban (NSA)"}
