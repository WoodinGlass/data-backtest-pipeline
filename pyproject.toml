[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-backtest-pipeline"
version = "0.1.0"
description = "Production-style data and ML pipeline for daily US equity direction prediction: ingestion -> warehouse -> features -> backtest -> monitoring."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "WoodinGlass" }]
keywords = ["data-engineering", "quant", "equities", "backtest", "dbt", "duckdb", "prefect", "mlflow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    # core
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    # http / retry
    "httpx>=0.27",
    "tenacity>=8.2",
    # data
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "duckdb>=0.10",
    # market data
    "yfinance>=0.2.40",
    # config
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "responses>=0.25",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pandas-stubs>=2.2",
    "types-python-dateutil",
    "types-PyYAML>=6.0",
]
dbt = [
    "dbt-core>=1.7",
    "dbt-duckdb>=1.7",
]
snowflake = [
    "dbt-snowflake>=1.7",
    "snowflake-connector-python>=3.7",
]
integration = [
    "testcontainers>=4.5",
    "psycopg[binary]>=3.1",
]
observability = [
    "prometheus-client>=0.20",
]
orchestration = [
    "prefect>=2.19",
]
tracking = [
    "mlflow>=2.12",
    "scikit-learn>=1.4",
]
quality = [
    "pandera>=0.19",
]
app = [
    "streamlit>=1.33",
    "plotly>=5.20",
]

[project.scripts]
dbp-ingest = "ingestion.cli:main"
dbp-ingest-macro = "ingestion.macro.cli:main"
dbp-quality = "quality.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "ingestion*", "features*", "backtest*", "models*",
    "orchestration*", "monitoring*", "app*", "quality*",
]

# ── ruff ────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["dbt", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "RET", "ARG", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]

# ── mypy ────────────────────────────────────────────────────
[tool.mypy]
# python_version is intentionally NOT pinned: mypy uses the interpreter it
# runs under. CI runs on 3.11; Colab runs on 3.13. The minimum supported
# version is declared via requires-python = ">=3.11".
strict = true
warn_unused_ignores = true
# Redundant casts: we insert `cast("pd.DataFrame", ...)` around
# DuckDB's `.fetchdf()` returns. On newer library stubs the cast is
# redundant; on older ones it is required. Disabling the redundant-
# cast warning keeps a single source of code that works across
# supported CI/dev Python versions.
warn_redundant_casts = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
# Pandera's `@dataframe_check` decorator does not expose a typed
# signature for its return value. We keep the check itself strict;
# only the decorator-level check is relaxed.
disallow_untyped_decorators = false
no_implicit_optional = true
show_error_codes = true
exclude = ["dbt/", "build/", "dist/"]

[[tool.mypy.overrides]]
module = ["duckdb.*", "prefect.*", "mlflow.*", "streamlit.*", "yfinance.*", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Pandera 0.33's `Series[T]` typing does not satisfy mypy strict's
# `type-arg` check: mypy sees `Series` as generic but cannot verify
# the type parameter the way we write it. The parameters are enforced
# at runtime by pandera itself, and serve as documentation. We disable
# only this specific check, only for the schema definition module.
module = ["quality.schemas"]
disable_error_code = ["type-arg"]

# ── pytest ──────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: needs Docker or an external service",
    "slow: long-running tests",
]

[tool.coverage.run]
source = ["ingestion", "features", "backtest", "models", "monitoring"]
branch = true
