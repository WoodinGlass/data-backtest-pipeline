version: 2

models:
  - name: int_fundamentals_pit
    description: >
      PIT fundamental values on trade dates. One row per
      (ticker, trade_date, namespace, tag). Value from the latest
      formal filing (10-K or 10-Q) with filed <= trade_date.
      Materialized as TABLE. See ADR 0010.
    columns:
      - name: trade_date
        data_tests: [not_null]
      - name: ticker
        data_tests: [not_null]
      - name: namespace
        data_tests: [not_null]
      - name: tag
        data_tests: [not_null]
      - name: value
      - name: filed_used
      - name: period_end_used
