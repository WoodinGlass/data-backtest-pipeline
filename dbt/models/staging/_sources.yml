version: 2

sources:
  - name: raw
    description: >
      Immutable raw layer. Each snapshot is a Parquet file written by
      ingestion/raw_store.py. Files are append-only; a new file appears
      whenever OHLCV content changes (adj_close noise is excluded — see
      ADR 0006).
    meta:
      external_location: "{{ var('raw_prices_glob') }}"
    tables:
      - name: prices
        description: >
          Daily OHLCV bars, one row per (ticker, trade_date). Columns
          match the ingestion schema exactly; no renaming happens here.
        columns:
          - name: ticker
            description: "Ticker symbol (e.g. AAPL)."
            data_tests:
              - not_null
          - name: date
            description: "Trade date (UTC-naive, one row per trading day)."
            data_tests:
              - not_null
          - name: close
            description: "Closing price, adjusted for splits per source."
            data_tests:
              - not_null
          - name: volume
            description: "Share volume; non-negative."
            data_tests:
              - not_null
      - name: macro
        description: >
          Vintage-aware macro observations, one row per
          (series_id, observation_date, vintage_date). Files written by
          ingestion/macro/raw_store.py. See ADR 0009.
        meta:
          external_location: "{{ var('raw_macro_glob') }}"
        columns:
          - name: series_id
            description: "FRED series id (e.g. FEDFUNDS)."
            data_tests:
              - not_null
          - name: observation_date
            description: "The period the value describes."
            data_tests:
              - not_null
          - name: vintage_date
            description: "FRED vintage date (when this revision became current)."
            data_tests:
              - not_null
          - name: value
            description: "Observed value; NULL when FRED returned '.'."
      - name: sec
        description: >
          SEC EDGAR companyfacts, one snapshot per ticker. Written by
          ingestion/sec/raw_store.py. Contains all XBRL tags returned
          by SEC; curated filtering happens in intermediate. See
          ADR 0010.
        meta:
          external_location: "{{ var('raw_sec_glob') }}"
        columns:
          - name: ticker
            description: "Ticker symbol."
            data_tests:
              - not_null
          - name: cik
            description: "SEC Central Index Key."
            data_tests:
              - not_null
          - name: namespace
            description: "XBRL namespace (us-gaap, dei, ...)."
            data_tests:
              - not_null
          - name: tag
            description: "XBRL tag name."
            data_tests:
              - not_null
          - name: filed
            description: "Date the fact first appeared in a filing."
            data_tests:
              - not_null
          - name: period_end
            description: "Period the fact describes."
            data_tests:
              - not_null
