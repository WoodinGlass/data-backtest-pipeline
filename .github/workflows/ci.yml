name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Python: lint, type-check, unit tests ─────────────────
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # `quality` extras bring in pandera, which mypy needs to
        # type-check quality/schemas.py and quality/gate.py.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,quality,backtest]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type-check (mypy)
        run: mypy ingestion quality

      - name: Unit tests
        run: pytest -m "not integration and not slow" --cov --cov-report=term-missing

  # ── Warehouse + quality gate: dbt + Pandera on fixture ───
  dbt-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dbt,quality]"

      - name: Prepare dbt profile
        run: cp dbt/profiles.example.yml dbt/profiles.yml

      - name: Install dbt packages
        run: dbt deps --project-dir dbt --profiles-dir dbt

      - name: Prepare warehouse directory
        run: mkdir -p data

      - name: dbt build (against committed fixture)
        # Override raw_prices_glob AND raw_macro_glob so dbt reads the
        # small committed fixtures under tests/fixtures/ instead of the
        # gitignored local raw layers. Keeps CI hermetic: no yfinance,
        # no FRED, no network, deterministic.
        run: |
          dbt build --project-dir dbt --profiles-dir dbt \
            --vars '{"raw_prices_glob": "tests/fixtures/raw/prices/yfinance/*/*.parquet", "raw_macro_glob": "tests/fixtures/raw/macro/fred/*/*.parquet", "raw_sec_glob": "tests/fixtures/raw/fundamentals/sec/*/*.parquet"}'

      - name: Quality gate (raw + staging + marts)
        # The gate reads the raw layer from where ingestion would have
        # written it. In CI there is no real ingest; we point at the
        # committed fixture instead. The warehouse was built in the
        # previous step, so staging and marts are available there.
        #
        # We skip the `sec` layer in CI for now: SEC fundamentals are
        # ingested locally but no SEC fixture is committed yet. The
        # layer will be enabled in CI in M3.8 alongside the fundamental
        # warehouse and its fixture.
        env:
          RAW_DATA_DIR: tests/fixtures/raw
        run: |
          python -m quality.cli \
            --tickers-from-raw \
            --skip sec \
            --json reports/quality.json

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: reports/quality.json
          if-no-files-found: ignore
          retention-days: 7
