name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default: only read repo contents. Jobs can request more if needed.
permissions:
  contents: read

jobs:
  # ===================================================================
  # 1. Lint + type-check + unit tests + coverage floor
  # ===================================================================
  lint-and-test:
    name: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # Extras: dev (pytest/ruff/mypy), quality (pandera),
        # backtest (scipy + scikit-learn for M5 tests). MLflow and
        # Prefect are intentionally NOT installed: their test suites
        # pass with the optional-import guards in tracking/_compat
        # and tracking/client.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,quality,backtest]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type-check (mypy)
        run: mypy ingestion quality

      - name: Unit tests + coverage
        # Coverage floor 70% is the ADR 0018 contract. Observed
        # baseline is 78%; the buffer absorbs Colab vs CI differences
        # (MLflow / Prefect extras absent in CI).
        run: |
          pytest -m "not integration and not slow" \
            --cov --cov-report=term-missing \
            --cov-fail-under=70

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .coverage
          if-no-files-found: ignore
          retention-days: 7

  # ===================================================================
  # 2. Warehouse: dbt build against committed fixtures
  # ===================================================================
  dbt-build:
    name: dbt-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dbt,quality]"

      - name: Prepare dbt profile
        run: cp dbt/profiles.example.yml dbt/profiles.yml

      - name: Install dbt packages
        run: dbt deps --project-dir dbt --profiles-dir dbt

      - name: Prepare warehouse directory
        run: mkdir -p data

      - name: "dbt build (against committed fixture)"
        # Override raw_*_glob so dbt reads committed fixtures under
        # tests/fixtures/. CI stays hermetic: no yfinance, no FRED,
        # no SEC EDGAR, deterministic.
        run: |
          dbt build --project-dir dbt --profiles-dir dbt \
            --vars '{"raw_prices_glob": "tests/fixtures/raw/prices/yfinance/*/*.parquet", "raw_macro_glob": "tests/fixtures/raw/macro/fred/*/*.parquet", "raw_sec_glob": "tests/fixtures/raw/fundamentals/sec/*/*.parquet"}'

      - name: "Quality gate (raw + staging + marts)"
        env:
          RAW_DATA_DIR: tests/fixtures/raw
        run: |
          python -m quality.cli \
            --tickers-from-raw \
            --skip sec \
            --json reports/quality.json

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: reports/quality.json
          if-no-files-found: ignore
          retention-days: 7

  # ===================================================================
  # 3. Docker image: build + smoke import inside the container
  # ===================================================================
  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: dbp-pipeline:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Smoke — import core packages inside the image"
        run: |
          docker run --rm dbp-pipeline:ci \
            python -c "import ingestion, backtest, tracking, orchestration; print('imports ok')"

      - name: "Smoke — orchestration CLI inside the image"
        run: |
          docker run --rm dbp-pipeline:ci \
            python -m orchestration.cli list

      - name: "Smoke — entrypoint is executable and non-root"
        run: |
          docker run --rm --entrypoint /bin/sh dbp-pipeline:ci -c "id -u; test -x /usr/local/bin/docker_entrypoint.sh && echo entrypoint-ok"
