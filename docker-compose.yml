# ---------------------------------------------------------------------
# data-backtest-pipeline — Docker Compose
# See docs/adr/0017-docker.md for design rationale.
#
# Usage:
#   make up          -> build + start worker (default)
#   make down        -> stop and remove containers
#   make shell       -> interactive shell inside worker
#   make pipeline    -> one-shot full pipeline run
#   make prefect-up  -> also start prefect-server (profile: served)
#
# State persists on the host via bind mounts:
#   ./data     raw layer, DuckDB warehouse, features, backtest runs
#   ./mlruns   MLflow SQLite + artifacts
#   ./reports  quality gate JSON reports
# ---------------------------------------------------------------------

name: data-backtest-pipeline

services:
  # ===================================================================
  # worker — the pipeline executor. Always up, idles by default.
  # ===================================================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: dbp-pipeline:local
    container_name: dbp-worker
    # Idle so the container stays up for `docker compose exec`.
    # Override per-command with `docker compose run --rm worker <cmd>`
    # or `make pipeline`.
    command: ["sleep", "infinity"]

    env_file:
      - path: .env
        required: false
    environment:
      # Bootstrap on container start (idempotent, cheap).
      DBP_DOCKER_BOOTSTRAP: "1"
      # PyArrow / DuckDB / MLflow all benefit from a small tmp dir
      # inside the container; the host's /tmp is not bind-mounted.
      TMPDIR: /tmp

    volumes:
      # Persistent state (host-owned, survives down/up).
      - ./data:/app/data
      - ./mlruns:/app/mlruns
      - ./reports:/app/reports
      # NOTE on .env: we do NOT bind-mount .env. Instead, compose
      # reads it via `env_file.required: false` above and exports
      # its contents as container env vars. pydantic-settings picks
      # them up from os.environ, so the code sees them as if the
      # file were present. This keeps `make up` working on a fresh
      # clone even when .env does not exist yet.

    # No ports published. Nothing in the pipeline listens.
    # Restart policy: manual by default so an interactive session
    # is not surprised by a restart. Opt in with `docker compose
    # up -d` after a reboot.
    restart: "no"

    # Resource caps: the pipeline is small but DuckDB can spike on
    # the fundamentals join (ADR 0011). These are generous bounds,
    # not tight limits.
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 512M

    healthcheck:
      test: ["CMD", "python", "-c", "import ingestion"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - dbp

  # ===================================================================
  # prefect-server — optional. Start with profile "served".
  # ===================================================================
  prefect-server:
    image: prefecthq/prefect:3-python3.11
    container_name: dbp-prefect-server
    profiles: ["served"]
    command: >
      prefect server start
      --host 0.0.0.0
      --port 4200
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_SERVER_API_PORT: "4200"
      PREFECT_API_DATABASE_CONNECTION_URL: "sqlite+aiosqlite:////data/prefect.db"
      PREFECT_UI_API_URL: "http://localhost:4200/api"
    volumes:
      - ./data/prefect:/data
    ports:
      - "4200:4200"
    restart: unless-stopped
    networks:
      - dbp

networks:
  dbp:
    driver: bridge
